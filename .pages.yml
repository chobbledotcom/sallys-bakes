media:
  - name: blog-images
    label: Blog Images
    input: blog-images
    output: /blog-images
    categories: [image]
  - name: photos
    label: Product Photos
    input: assets/photos
    output: /assets/photos
    categories: [image]

content:
  - name: pages
    label: Pages
    type: collection
    path: _pages
    subfolders: false
    filename: "{primary}.md"
    exclude: ["README.md"]
    view:
      fields: [title, linkText, order, permalink]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, type: string, label: Title, required: true }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: metaTitle, type: string, label: Meta Title }
      - name: layout
        type: select
        label: Layout
        options:
          values: [home, page, contact, posts, ingredients]
      - { name: linkText, type: string, label: Nav Link Text }
      - { name: order, type: number, label: Nav Order }
      - { name: permalink, type: string, label: Permalink }
      - { name: contact, type: boolean, label: Show Contact Form }
      - { name: noindex, type: boolean, label: Hide From Search Engines }
      - { name: sitemap, type: boolean, label: Include In Sitemap, default: true }
      - { name: body, type: rich-text, label: Body }

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    subfolders: false
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: ["README.md"]
    view:
      fields: [title]
      primary: title
      sort: [-name]
    fields:
      - { name: title, type: string, label: Title, required: true }
      - { name: body, type: rich-text, label: Body }

  - name: ingredients
    label: Ingredients
    type: collection
    path: _ingredients
    subfolders: false
    filename: "{primary}.md"
    exclude: ["README.md"]
    view:
      fields: [title]
      primary: title
      sort: [title]
    fields:
      - { name: title, type: string, label: Title, required: true }
      - { name: layout, type: string, label: Layout }
      - { name: body, type: rich-text, label: Body }
